<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4: Table and Form</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="navbar">
        <a href="../index.html">Task 1</a>
        <a href="../task2/index.html">Task 2</a>
        <a href="../exercise1/index.html">Task 3</a>
        <a class="active" href="index.html">Task 4</a>
        <a href="../task5/index.html">Task 5</a>
    </div>

    <div class="container">

        <h1 id="page-title">Student Grades</h1>

        <table>
            <tr>
                <th>Name</th>
                <th>Subject</th>
                <th>Grade</th>
            </tr>
            <tr>
                <td rowspan="2">Aigerim</td>
                <td>HTML &amp; CSS</td>
                <td>92</td>
            </tr>
            <tr>
                <td>JavaScript</td>
                <td>88</td>
            </tr>
            <tr class="highlight-row">
                <td>Nurlan</td>
                <td>HTML &amp; CSS</td>
                <td>97</td>
            </tr>
            <tr>
                <td>Daniyar</td>
                <td>Bootstrap</td>
                <td>81</td>
            </tr>
            <tr>
                <td colspan="2">Average</td>
                <td>89.5</td>
            </tr>
        </table>

        <h2>Feedback Form</h2>

        <form id="feedback-form" action="#" method="get">

            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="role">Role</label>
            <select id="role" name="role">
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
                <option value="other">Other</option>
            </select>

            <label>Do you like this course?</label>
            <input type="radio" id="yes" name="answer" value="yes" checked>
            <label class="inline" for="yes">Yes</label>
            <input type="radio" id="no" name="answer" value="no">
            <label class="inline" for="no">No</label>

            <label for="comments">Comments</label>
            <textarea id="comments" name="comments" rows="5"></textarea>

            <button type="submit" class="submit-btn">Send</button>

        </form>

    </div>

</body>

</html>
